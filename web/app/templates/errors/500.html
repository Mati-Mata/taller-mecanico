{% extends "base.html" %}
{% block title %}Error interno | Taller Mecánico{% endblock %}
{% block content %}
<section class="error-card">
    <span class="error-code">500</span>
    <h2>No fue posible completar la operación</h2>
    <p>Revise la conexión local y vuelva a intentarlo.</p>
    <a class="btn btn-accent" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">
        Volver
    </a>
</section>
{% endblock %}
