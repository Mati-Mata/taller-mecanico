{% extends "base.html" %}
{% block title %}Página no encontrada | Taller Mecánico{% endblock %}
{% block content %}
<section class="error-card">
    <span class="error-code">404</span>
    <h2>Página no encontrada</h2>
    <p>La función solicitada no existe o todavía no está disponible.</p>
    <a class="btn btn-accent" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">
        Volver
    </a>
</section>
{% endblock %}
